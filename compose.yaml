services:
  whatsapp-ia:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      IQT_AUTH_MODE: standalone
      IQT_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
      IQT_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8787}
      IQT_MAX_CONNECTIONS: 1
    volumes:
      - whatsapp_data:/data
    mem_limit: 256m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
volumes:
  whatsapp_data:
